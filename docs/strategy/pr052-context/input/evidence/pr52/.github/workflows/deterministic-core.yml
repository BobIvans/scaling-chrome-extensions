name: Deterministic OCC core

on:
  pull_request:
    paths:
      - 'content-lab/**'
      - 'desktop/**'
      - 'agent-bridge/**'
      - 'one-click-context/**'
      - 'docs/automation/**'
      - 'README.md'
      - '.gitattributes'
      - '.github/workflows/deterministic-core.yml'
  push:
    branches: ['main', 'codex/durable-automation-core-20261001']
    paths:
      - 'content-lab/**'
      - 'desktop/**'
      - 'agent-bridge/**'
      - 'one-click-context/**'
      - 'docs/automation/**'
      - 'README.md'
      - '.gitattributes'
      - '.github/workflows/deterministic-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact event head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Exact context, recovery, fences and reconciliation
        run: python -I -X utf8 content-lab/test_context_services.py
      - name: Context and campaigns share operator scope and Core STOP
        run: python -m unittest discover -s content-lab -p 'test_context_workflow_interop.py' -v
      - name: Installed context workflow and independent STOP
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s desktop/tests -p 'test_context_workflow.py' -v
          else
            python -m unittest discover -s desktop/tests -p 'test_context_workflow.py' -v
          fi
      - name: Verify desktop owned files
        run: python -I -X utf8 desktop/package.py verify --shell desktop

  core:
    needs: context-platform
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Full real-Git/SQLite scale fixtures take longer on Windows/NTFS.
    timeout-minutes: 30
    steps:
      - name: Keep exact checkout bytes independent of Windows Git defaults
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact event head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: IANA timezone database for Windows daily schedules
        run: python -m pip install tzdata==2025.2
      - name: Content and durable automation contracts
        run: python -m unittest discover -s content-lab -p 'test_*.py' -v
      - name: Desktop transport, draft and package contracts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s desktop/tests -p 'test_*.py' -v
          else
            python -m unittest discover -s desktop/tests -p 'test_*.py' -v
          fi
      - name: Verify desktop owned files
        run: python -I -X utf8 desktop/package.py verify --shell desktop
      - name: Existing native bridge regression
        run: node --test agent-bridge/*.test.mjs
      - name: Qualification adapter regression
        run: python -m unittest discover -s agent-bridge -p 'test_qualification_adapter.py' -v
      - name: Existing extension regression
        shell: bash
        run: node --test one-click-context/tests/*.test.*

  linked-research-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Keep exact checkout bytes independent of Windows Git defaults
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: sce
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BobIvans/studious-pancake
          ref: 905976ebd3046121728161d42f2e781c01f53e10
          path: studious
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install the pinned owner dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install --require-hashes -r studious/requirements-dev.lock
          else
            # Linux wheel lock contains uvloop; the declared Windows profile excludes it.
            python -m pip install -r studious/requirements-dev.txt
          fi
          python -m pip install --no-deps --no-build-isolation ./studious
      - name: Execute the actual Core to Studious to Desktop model path
        shell: bash
        run: |
          python sce/docs/automation/pr020-021/verify_linked_replay.py \
            --studious "$GITHUB_WORKSPACE/studious" \
            --source-commit 905976ebd3046121728161d42f2e781c01f53e10 \
            --python "$(python -c 'import sys; print(sys.executable)')" \
            --work-dir "$RUNNER_TEMP/pr020-021-offline-model"
