name: Deterministic OCC core

on:
  pull_request:
    paths:
      - 'content-lab/**'
      - 'agent-bridge/**'
      - 'one-click-context/**'
      - 'docs/automation/**'
      - 'README.md'
      - '.github/workflows/deterministic-core.yml'
  push:
    branches: ['main', 'codex/durable-automation-core-20261001']
    paths:
      - 'content-lab/**'
      - 'agent-bridge/**'
      - 'one-click-context/**'
      - 'docs/automation/**'
      - 'README.md'
      - '.github/workflows/deterministic-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Full real-Git/SQLite scale fixtures take longer on Windows/NTFS.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact event head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Content and durable automation contracts
        run: python -m unittest discover -s content-lab -p 'test_*.py' -v
      - name: Existing native bridge regression
        run: node --test agent-bridge/*.test.mjs
      - name: Qualification adapter regression
        run: python -m unittest discover -s agent-bridge -p 'test_qualification_adapter.py' -v
      - name: Existing extension regression
        shell: bash
        run: node --test one-click-context/tests/*.test.*
